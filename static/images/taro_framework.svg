<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 560" role="img" aria-labelledby="title description">
  <title id="title">Animated TARO framework</title>
  <desc id="description">Visual observations, tactile observations, and robot state are encoded or fused into a shared source. Condition-free flow matching directly transports the source into a joint latent used for action, future visual, and future tactile prediction.</desc>
  <defs>
    <linearGradient id="visual" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7258ff"/><stop offset="1" stop-color="#a99cff"/>
    </linearGradient>
    <linearGradient id="tactile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12a287"/><stop offset="1" stop-color="#61d7c2"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7258ff"/><stop offset=".5" stop-color="#3d8fd1"/><stop offset="1" stop-color="#16a68d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#26324a" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
      <path d="M0 0L6 3 0 6Z" fill="#929bad"/>
    </marker>
    <marker id="arrow-light" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
      <path d="M0 0L6 3 0 6Z" fill="#fff"/>
    </marker>

    <path id="p1" d="M190 110H230"/>
    <path id="p2" d="M190 450H230"/>
    <path id="p3" d="M370 120C410 120 402 235 432 255"/>
    <path id="p4" d="M370 440C410 440 402 325 432 305"/>
    <path id="pstate" d="M370 280H430"/>
    <path id="p8" d="M1145 232C1230 232 1215 95 1300 95"/>
    <path id="p9" d="M1145 280H1300"/>
    <path id="p10" d="M1145 328C1230 328 1215 465 1300 465"/>

    <path id="f1" d="M705 240C765 198 885 198 945 240"/>
    <path id="f2" d="M705 280C775 250 875 250 945 280"/>
    <path id="f3" d="M705 320C775 350 875 350 945 320"/>
    <path id="f4" d="M705 360C765 402 885 402 945 360"/>
  </defs>

  <style>
    text { font-family: "Google Sans", "Noto Sans", Arial, sans-serif; }
    .card { fill: #fff; stroke: #dce0e9; stroke-width: 2.5; }
    .label { fill: #252b38; font-size: 22px; font-weight: 700; text-anchor: middle; }
    .compact-label { font-size: 20px; }
    .output-label { font-size: 20px; }
    .small { fill: #727d92; font-size: 19px; text-anchor: middle; }
    .light { fill: #fff; }
    .connector { fill: none; marker-end: url(#arrow); stroke: #929bad; stroke-dasharray: 9 8; stroke-width: 3.5; animation: travel 1.2s linear infinite; }
    .flow-line { fill: none; marker-end: url(#arrow-light); stroke: rgb(255 255 255 / 85%); stroke-width: 3.5; }
    .visual-particle { fill: #806cff; }
    .tactile-particle { fill: #22b69a; }
    .state-particle { fill: #65738d; }
    .fused-particle { fill: #398fc3; }
    .action-particle { fill: #ed8b3a; }
    .flow-particle { fill: #fff; filter: drop-shadow(0 2px 3px rgb(25 36 65 / 35%)); }
    .particle { filter: drop-shadow(0 2px 2px rgb(38 50 74 / 30%)); }
    .touch-hot { animation: pulse 1.7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .target-part { animation: target-pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .target-part.visual { animation-delay: -.8s; }
    .target-part.tactile { animation-delay: -1.6s; }
    @keyframes travel { to { stroke-dashoffset: -34; } }
    @keyframes pulse { 50% { opacity: .65; transform: scale(1.3); } }
    @keyframes target-pulse { 50% { opacity: .68; transform: scaleX(.88); } }
    @media (prefers-reduced-motion: reduce) {
      .particles { display: none; }
      .connector, .touch-hot, .target-part { animation: none; }
    }
  </style>

  <rect width="1540" height="560" rx="26" fill="#fafbfe"/>

  <g filter="url(#shadow)">
    <!-- Observations. -->
    <rect x="20" y="20" width="170" height="180" rx="22" class="card"/>
    <rect x="40" y="40" width="130" height="90" rx="12" fill="#eef0ff"/>
    <path d="M55 116L80 91 100 107 127 72 157 116Z" fill="url(#visual)" opacity=".9"/>
    <circle cx="68" cy="65" r="11" fill="#f5b84b"/>
    <text x="105" y="158" class="label compact-label">Visual</text>
    <text x="105" y="184" class="label compact-label">observation</text>

    <rect x="20" y="360" width="170" height="180" rx="22" class="card"/>
    <rect x="58" y="378" width="94" height="94" rx="16" fill="#e5f8f4"/>
    <g fill="#75d8c6">
      <circle cx="79" cy="399" r="9"/><circle cx="105" cy="399" r="9"/><circle cx="131" cy="399" r="9"/>
      <circle cx="79" cy="425" r="9"/><circle cx="105" cy="425" r="13" fill="#ff8d5a" class="touch-hot"/><circle cx="131" cy="425" r="9"/>
      <circle cx="79" cy="451" r="9"/><circle cx="105" cy="451" r="9"/><circle cx="131" cy="451" r="9"/>
    </g>
    <text x="105" y="498" class="label compact-label">Tactile</text>
    <text x="105" y="524" class="label compact-label">observation</text>

    <!-- Narrow encoders. -->
    <rect x="230" y="55" width="140" height="130" rx="22" class="card" stroke="#a99cff"/>
    <rect x="278" y="70" width="44" height="39" rx="11" fill="#eeeaff"/>
    <path d="M286 101L296 91 303 97 314 83 318 101Z" fill="#806cff"/>
    <text x="300" y="140" class="label compact-label">Visual</text>
    <text x="300" y="166" class="label compact-label">Encoder</text>

    <rect x="230" y="375" width="140" height="130" rx="22" class="card" stroke="#73d9c6"/>
    <rect x="278" y="390" width="44" height="39" rx="11" fill="#e5f8f4"/>
    <circle cx="289" cy="400" r="4" fill="#55cdb7"/><circle cx="300" cy="410" r="6" fill="#ff8d5a"/><circle cx="311" cy="419" r="4" fill="#55cdb7"/>
    <text x="300" y="460" class="label compact-label">Tactile</text>
    <text x="300" y="486" class="label compact-label">Encoder</text>

    <!-- Robot state enters fusion directly. -->
    <rect x="230" y="220" width="140" height="120" rx="22" class="card" stroke="#9ca6b8"/>
    <rect x="278" y="235" width="44" height="39" rx="11" fill="#eef1f6"/>
    <path d="M286 245H314M286 255H314M286 265H314" stroke="#65738d" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="294" cy="245" r="4.5" fill="#fff" stroke="#65738d" stroke-width="2.5"/>
    <circle cx="307" cy="255" r="4.5" fill="#fff" stroke="#65738d" stroke-width="2.5"/>
    <circle cx="298" cy="265" r="4.5" fill="#fff" stroke="#65738d" stroke-width="2.5"/>
    <text x="300" y="312" class="label compact-label">Robot state</text>

    <!-- Smaller fusion and shared source. -->
    <circle cx="465" cy="280" r="35" fill="#fff" stroke="url(#flow)" stroke-width="5"/>
    <path d="M448 272H482M448 288H482M465 261V299" stroke="#566178" stroke-width="7" stroke-linecap="round"/>
    <text x="465" y="348" class="label compact-label">Fusion</text>

    <rect x="515" y="190" width="135" height="180" rx="24" class="card" stroke="#7d6aff"/>
    <g fill="#8a76ff">
      <rect x="543" y="216" width="79" height="15" rx="8"/>
      <rect x="543" y="243" width="56" height="15" rx="8"/>
      <rect x="543" y="270" width="84" height="15" rx="8"/>
    </g>
    <g fill="#37bda5">
      <rect x="543" y="306" width="64" height="15" rx="8"/>
      <rect x="543" y="333" width="80" height="15" rx="8"/>
    </g>
    <text x="582" y="408" class="label compact-label">Shared source</text>

    <!-- Taller, condition-free direct transport; intentionally no outer connector arrows. -->
    <rect x="665" y="85" width="320" height="390" rx="30" fill="url(#flow)"/>
    <text x="825" y="141" class="label light">Condition-free</text>
    <text x="825" y="172" class="label light">flow matching</text>
    <g>
      <use href="#f1" class="flow-line"/><use href="#f2" class="flow-line"/>
      <use href="#f3" class="flow-line"/><use href="#f4" class="flow-line"/>
    </g>
    <text x="825" y="440" class="small light">direct z<tspan baseline-shift="sub" font-size="14">s</tspan> → z<tspan baseline-shift="sub" font-size="14">t</tspan> transport</text>

    <!-- Joint latent and predictions. -->
    <rect x="1000" y="190" width="145" height="180" rx="24" class="card" stroke="#389dba"/>
    <rect x="1029" y="214" width="87" height="35" rx="9" fill="#f3a25e" class="target-part action"/>
    <rect x="1029" y="262" width="87" height="35" rx="9" fill="#8a76ff" class="target-part visual"/>
    <rect x="1029" y="310" width="87" height="35" rx="9" fill="#37bda5" class="target-part tactile"/>
    <text x="1072" y="408" class="label compact-label">Joint latent</text>
    <text x="1072" y="437" class="small">joint prediction</text>

    <rect x="1300" y="10" width="220" height="170" rx="22" class="card" stroke="#f4bb89"/>
    <path d="M1345 114C1375 62 1425 127 1475 66" fill="none" stroke="#ed8b3a" stroke-width="9" stroke-linecap="round"/>
    <circle cx="1345" cy="114" r="10" fill="#ed8b3a"/><circle cx="1475" cy="66" r="10" fill="#ed8b3a"/>
    <text x="1410" y="156" class="label output-label">Action chunk</text>

    <rect x="1300" y="195" width="220" height="170" rx="22" class="card" stroke="#b8acff"/>
    <rect x="1350" y="224" width="70" height="69" rx="9" fill="#dcd8ff"/>
    <rect x="1400" y="241" width="70" height="69" rx="9" fill="#bdb4ff"/>
    <text x="1410" y="343" class="label output-label">Future visual latent</text>

    <rect x="1300" y="380" width="220" height="170" rx="22" class="card" stroke="#7edbc9"/>
    <g fill="#38bca4">
      <circle cx="1360" cy="425" r="13"/><circle cx="1410" cy="425" r="18"/><circle cx="1460" cy="425" r="13"/>
      <circle cx="1360" cy="470" r="13"/><circle cx="1410" cy="470" r="13"/><circle cx="1460" cy="470" r="13"/>
    </g>
    <text x="1410" y="526" class="label output-label">Future tactile latent</text>
  </g>

  <g>
    <use href="#p1" class="connector"/><use href="#p2" class="connector"/>
    <use href="#p3" class="connector"/><use href="#p4" class="connector"/>
    <use href="#pstate" class="connector"/>
    <use href="#p8" class="connector"/><use href="#p9" class="connector"/><use href="#p10" class="connector"/>
  </g>

  <g class="particles">
    <circle r="8" class="particle visual-particle"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="8" class="particle tactile-particle"><animateMotion dur="2.6s" begin="-.35s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="8" class="particle visual-particle"><animateMotion dur="2.6s" begin="-.65s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="8" class="particle tactile-particle"><animateMotion dur="2.6s" begin="-1s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
    <circle r="7" class="particle state-particle"><animateMotion dur="2.1s" begin="-.8s" repeatCount="indefinite"><mpath href="#pstate"/></animateMotion></circle>
    <circle r="8" class="particle action-particle"><animateMotion dur="2.8s" begin="-2s" repeatCount="indefinite"><mpath href="#p8"/></animateMotion></circle>
    <circle r="8" class="particle visual-particle"><animateMotion dur="2.8s" begin="-2.25s" repeatCount="indefinite"><mpath href="#p9"/></animateMotion></circle>
    <circle r="8" class="particle tactile-particle"><animateMotion dur="2.8s" begin="-2.5s" repeatCount="indefinite"><mpath href="#p10"/></animateMotion></circle>
    <circle r="7" class="flow-particle"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#f1"/></animateMotion></circle>
    <circle r="7" class="flow-particle"><animateMotion dur="2.2s" begin="-.55s" repeatCount="indefinite"><mpath href="#f2"/></animateMotion></circle>
    <circle r="7" class="flow-particle"><animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite"><mpath href="#f3"/></animateMotion></circle>
    <circle r="7" class="flow-particle"><animateMotion dur="2.2s" begin="-1.65s" repeatCount="indefinite"><mpath href="#f4"/></animateMotion></circle>
  </g>
</svg>
